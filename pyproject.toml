[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halal-trading"
version = "0.1.0"
description = "Système interne de prévision et de trading automatisé, strictement halal (tolérance zéro sur l'intérêt)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
halal-data = "halal_trading.data.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
