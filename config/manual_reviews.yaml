# Vérifications manuelles des données financières manquantes
#
# Les sources gratuites ne fournissent pas toutes les lignes nécessaires au
# filtre tolérance zéro (en particulier les « autres revenus non conformes »).
# Une donnée manquante entraîne l'exclusion. Pour la compléter, une personne
# vérifie le rapport annuel et l'inscrit ici, avec sa source.
#
# Règles appliquées par le code :
# - une vérification ne complète QUE les champs absents des données ; elle ne
#   remplace jamais une valeur fournie par la source ;
# - une vérification plus ancienne que max_financials_age_days est ignorée.
#
# Exemple :
# reviews:
#   - symbol: XXXX
#     reviewed_by: "Nom"
#     reviewed_at: 2026-11-19
#     source: "Rapport annuel 2025, note 12, p. 112"
#     fields:
#       non_permissible_income: 0

reviews:
  - symbol: CRM
    reviewed_by: "Claude (recherche web, à valider)"
    reviewed_at: 2026-11-19
    source: >-
      Salesforce 10-K exercice clos le 31/01/2026 (sec.gov, crm-20260131.htm) :
      « Interest income from marketable securities [...] was $539 million »,
      inclus dans « Other income ». Soit 1,30 % du CA (41 525 M$).
    fields:
      interest_income: 539000000

  - symbol: CPRT
    reviewed_by: "Claude (recherche web, à valider)"
    reviewed_at: 2026-11-19
    source: >-
      Copart, communiqué des résultats T4 de l'exercice clos le 31/07/2026
      (non audité) : « Interest income, net » 181 923 k$. Copart n'a pas de
      dette financière : le montant net est retenu comme revenu d'intérêts.
      Soit 3,90 % du CA (4 666 M$). À recouper avec le 10-K.
    fields:
      interest_income: 181923000
