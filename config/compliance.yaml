# Politique de conformité halal
#
# Deux niveaux distincts :
#
# 1. NOS OPÉRATIONS — tolérance zéro, non configurable :
#    compte « cash », pas de marge, pas de levier, pas de vente à découvert,
#    pas de solde négatif, pas d'intérêt reçu ni payé, pas de staking.
#    (voir order_guard.py, account_guard.py, ledger_monitor.py)
#
# 2. LES SOCIÉTÉS DANS LESQUELLES ON INVESTIT — profil ci-dessous :
#    - "aaoifi" : norme AAOIFI (dette tolérée sous plafond, purification) ;
#      les exclusions d'activité restent totales (banque, assurance, alcool...).
#    - "zero_tolerance" : aucune dette, aucun intérêt (univers quasi vide).
#
# Le chargeur refuse un profil « aaoifi » plus permissif que la norme.

profile: aaoifi

# Seuls ces types d'instruments peuvent être achetés.
allowed_instrument_types:
  - common_stock   # actions ordinaires
  - crypto_spot    # crypto au comptant (pas de dérivés, pas de stablecoins)

# Devises de cotation acceptées : monnaies fiat uniquement (pas d'USDC/USDT).
# Le change se fait au comptant chez le broker (pas de report, pas d'intérêt).
allowed_quote_currencies:
  - EUR
  - USD
  - GBP
  - CHF
  - DKK
  - SEK
  - NOK

# Filtre financier des sociétés (norme AAOIFI). Valeur vide (~) = critère non vérifié.
thresholds:
  max_interest_bearing_debt_ratio: 0.30          # dette à intérêt / capitalisation
  max_interest_bearing_investments_ratio: 0.30   # dépôts, obligations, placements à intérêt / capitalisation
  max_interest_income_ratio: ~                   # inclus dans le total ci-dessous
  max_interest_expense_ratio: ~                  # couvert par le ratio de dette
  max_non_permissible_income_ratio: 0.05         # revenus non conformes TOTAUX (intérêts compris) / CA

# Yahoo ne fournit pas les « autres revenus non conformes ».
#   exclude          : la société est exclue (obligatoire en tolérance zéro)
#   activity_screen  : on s'appuie sur le filtre d'activité (secteur + description),
#                      avec un avertissement dans le rapport
missing_non_permissible_income: activity_screen

# Crédit-bail financier : compté comme dette à intérêt.
# Locations simples (loyers) : non comptées, un loyer n'est pas un prêt.
# (Yahoo ne distinguant pas les deux, toutes les locations sont comptées : prudent.)
count_finance_leases_as_debt: true
count_operating_leases_as_debt: false

# Fraîcheur des données
max_financials_age_days: 400      # comptes publiés il y a plus de 400 jours -> refus
max_screening_age_days: 100       # re-filtrage obligatoire chaque trimestre
max_account_confirmation_age_days: 90

# Activités interdites : un mot-clé trouvé dans le secteur, l'industrie, les
# activités déclarées ou un segment de chiffre d'affaires entraîne l'exclusion.
prohibited_activities:
  alcool: [alcohol, alcoholic, beverages - wineries & distilleries, brewer, brewery, breweries, beer, wine, winery, wineries, spirits, distiller, distillery, distilleries, liquor, alcool, bière, vin, spiritueux]
  porc: [pork, swine, hog, hogs, pig, pigs, bacon, ham, porc, charcuterie]
  jeux_d_argent: [casino, casinos, gambling, betting, wagering, lottery, lotteries, sportsbook, jeux d'argent, paris sportifs]
  tabac: [tobacco, cigarette, cigarettes, cigar, cigars, vaping, e-cigarette, tabac]
  finance_conventionnelle: [bank, banks, banking, insurance, insurer, reinsurance, credit services, consumer finance, consumer lending, mortgage, mortgages, lending, lender, savings & loan, thrift, capital markets, mortgage finance, banque, assureur, compagnie d'assurance, crédit à la consommation]
  contenu_adulte: [adult entertainment, pornography, adult content]
  armement: [weapons, firearms, ammunition, munitions, missiles, military, aerospace & defense, defense contractor, defense systems, defence and space, armement]
  drogues: [cannabis, marijuana]
  sans_activite: [shell companies, shell company, blank check, special purpose acquisition]   # SPAC : trésorerie placée en bons du Trésor

# Crypto : liste blanche EXPLICITE, vide par défaut.
# Chaque actif ajouté doit être validé (par toi et idéalement un savant).
# Exemple : - {symbol: BTC, approved_by: "nom", note: "monnaie, pas de rendement"}
crypto_whitelist: []

# Catégories de crypto toujours interdites.
forbidden_crypto_categories:
  - lending          # protocoles de prêt (Aave, Compound...)
  - yield            # produits de rendement
  - staking          # staking et jetons de staking liquide
  - stablecoin       # réserves placées à intérêt
  - gambling
  - derivatives
  - leverage
